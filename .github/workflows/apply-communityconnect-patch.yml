name: Apply CommunityConnect production patch

on:
  push:
    branches: [main]
    paths:
      - '.communityconnect-patch/**'
      - '.github/workflows/apply-communityconnect-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch archive
        run: |
          cat .communityconnect-patch/raw.* > /tmp/communityconnect-patch.tgz
          tar -xzf /tmp/communityconnect-patch.tgz -C .
      - name: Validate production build
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit production hardening
        run: |
          rm -rf .communityconnect-patch
          rm -f .github/workflows/apply-communityconnect-patch.yml
          git config user.name "CommunityConnect Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden CommunityConnect for Supabase production"
          git push origin main
